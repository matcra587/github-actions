- provider: http
  url: https://registry.npmjs.org/@actions/core/latest
  extract: /"version"\s*:\s*"([^" ]+)"/
  find: '"@actions/core": "<version>"'
  constraint: major
  tags: npm
- provider: http
  url: https://registry.npmjs.org/yaml/latest
  extract: /"version"\s*:\s*"([^" ]+)"/
  find: '"yaml": "<version>"'
  constraint: major
  tags: npm
