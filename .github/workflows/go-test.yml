---
name: go-test

on:
  workflow_call:
    inputs:
      go-version:
        description: Go toolchain version.
        type: string
        default: "1.26"
      test-args:
        description: Arguments passed to `go test`.
        type: string
        default: "-v -race -cover ./..."
      vet:
        description: Run `go vet ./...`.
        type: boolean
        default: true

permissions: {}

jobs:
  test:
    name: Go build & test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        # clover: provider=auto constraint=minor tags=checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        # clover: provider=auto constraint=minor tags=setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Download deps
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Test
        run: |
          read -ra args <<< "${TEST_ARGS}"
          go test "${args[@]}"
        shell: bash
        env:
          TEST_ARGS: ${{ inputs.test-args }}

      - name: Vet
        if: inputs.vet
        run: go vet ./...
