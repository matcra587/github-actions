---
name: go-ci

on:
  workflow_call:
    inputs:
      go-version-file:
        description: File to read the primary Go version from.
        type: string
        default: go.mod
      go-versions:
        description: >-
          JSON array of Go versions for the test matrix. An empty string entry
          uses go-version-file instead.
        type: string
        default: '[""]'
      os:
        description: JSON array of runner labels for the test matrix.
        type: string
        default: '["ubuntu-latest"]'
      test-args:
        description: >-
          Arguments passed to `go test` in the platform matrix. Replaces the
          default rather than adding to it.
        type: string
        default: "-shuffle=on ./..."
      race-args:
        description: >-
          Arguments passed to `go test` in the race job. Replaces the default
          rather than adding to it. -coverprofile and -covermode are appended
          by the job. The default includes -p 2 to bound race-instrumented
          memory; drop it when the suite needs the parallelism.
        type: string
        default: "-race -shuffle=on -count=1 -coverpkg=./... -p 2 ./..."
      coverage-threshold:
        description: >-
          Minimum total coverage percent. 0 reports the number without failing.
          Gates the total, not the diff.
        type: number
        default: 0
      golangci-version:
        description: >-
          golangci-lint version. Keep in sync with the repo's .mise.toml pin.
        type: string
        # clover: provider=github repository=golangci/golangci-lint constraint=minor tags=golangci-lint,github
        default: "v2.12.2"
      timeout:
        description: golangci-lint timeout (e.g. 5m).
        type: string
        default: "5m"
      cross-compile-targets:
        description: >-
          JSON array of GOOS/GOARCH pairs to build and vet, e.g.
          '["darwin/arm64", "windows/amd64"]'. Empty disables the job.
        type: string
        default: "[]"
      goprivate:
        description: >-
          GOPRIVATE glob for private module paths, e.g. github.com/org/*. When
          set, git is configured to fetch matching paths with a token.
        type: string
        default: ""
      skip:
        description: >-
          Jobs and checks to skip, space-separated (a single line). Entries
          are verified -- unknown names fail the workflow. Allowed values are
          deps, lint, tidy, modernize, test, race, and cross-compile.
        type: string
        default: ""
    secrets:
      MODULE_TOKEN:
        description: >-
          Token for private modules in other repositories. Defaults to the
          caller's GITHUB_TOKEN, which only reaches the calling repo.
          Dependabot-triggered runs read secrets from the Dependabot secrets
          store -- configure it there as well.
        required: false

permissions: {}

jobs:
  validate:
    name: validate inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify skip entries
        run: |
          allowed="deps lint tidy modernize test race cross-compile"
          # The job gates match ' name ' with single spaces; any other whitespace
          # would pass this validation yet skip nothing.
          case "${SKIP}" in
            *$'\n'* | *$'\t'* | *$'\r'*)
              echo "::error::skip must be a single space-separated line; newline/tab entries are never matched by the job gates."
              exit 1
              ;;
          esac
          unknown=""
          for name in ${SKIP}; do
            case " ${allowed} " in
              *" ${name} "*) ;;
              *) unknown="${unknown}${unknown:+, }${name}" ;;
            esac
          done
          if [ -n "${unknown}" ]; then
            echo "::error::Unknown skip entries: ${unknown}. Allowed: $(echo "${allowed}" | tr ' ' ',' | sed 's/,/, /g')."
            exit 1
          fi
          echo "skip entries valid: ${SKIP:-(none)}"
        shell: bash
        env:
          SKIP: ${{ inputs.skip }}

  lint:
    name: lint
    if: >-
      ${{ !contains(format(' {0} ', inputs.skip), ' lint ')
      || !contains(format(' {0} ', inputs.skip), ' tidy ')
      || !contains(format(' {0} ', inputs.skip), ' modernize ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate
    permissions:
      contents: read
    env:
      GOPRIVATE: ${{ inputs.goprivate }}
    steps:
      - name: Checkout
        # clover: provider=auto constraint=minor tags=checkout,github
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      # Tokens via env, never interpolated into the script body.
      - name: Configure private module access
        if: ${{ inputs.goprivate != '' }}
        run: |
          # Dependabot-triggered runs resolve secrets from the Dependabot
          # store; an unset MODULE_TOKEN silently falls back to github.token,
          # which only reaches this repo. Warn rather than fail: the fallback
          # is legitimate when goprivate covers nothing outside this repo.
          if [ "${GITHUB_ACTOR}" = "dependabot[bot]" ] && [ -z "${MODULE_TOKEN}" ]; then
            echo "::warning::MODULE_TOKEN is empty on a Dependabot run -- if the module fetch fails below, add MODULE_TOKEN to the repository's Dependabot secrets."
          fi
          token="${MODULE_TOKEN:-${DEFAULT_TOKEN}}"
          git config --global \
            url."https://x-access-token:${token}@github.com/".insteadOf "https://github.com/"
        shell: bash
        env:
          DEFAULT_TOKEN: ${{ github.token }}
          MODULE_TOKEN: ${{ secrets.MODULE_TOKEN }}

      - name: Set up Go
        # clover: provider=auto constraint=minor tags=setup-go,github
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true

      # Order matters: `verify` only checks modules already in the local cache,
      # so it is a no-op before `download` on a cold runner.
      - name: Download and verify deps
        id: deps
        if: ${{ !contains(format(' {0} ', inputs.skip), ' deps ') }}
        run: |
          go mod download
          go mod verify

      # No separate `go vet`: the `standard` linter set already includes govet.
      - name: Run golangci-lint
        if: ${{ !contains(format(' {0} ', inputs.skip), ' lint ') }}
        # clover: provider=auto constraint=minor tags=golangci-lint-action,github
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ inputs.golangci-version }}
          args: --timeout=${{ inputs.timeout }}
          problem-matchers: true

      # The action leaves golangci-lint on PATH; `run` alone does not apply the
      # formatters section. Gated on deps: a broken module download would only
      # produce spurious diffs here. (If setup-go itself fails, deps is skipped
      # -- outcome 'skipped' passes this gate, but the job is already red.)
      - name: Check formatting
        if: >-
          ${{ !cancelled() && steps.deps.outcome != 'failure'
          && !contains(format(' {0} ', inputs.skip), ' lint ') }}
        run: golangci-lint fmt --diff ./...

      - name: Verify go.mod and go.sum are tidy
        if: >-
          ${{ !cancelled() && steps.deps.outcome != 'failure'
          && !contains(format(' {0} ', inputs.skip), ' tidy ') }}
        run: go mod tidy -diff

      # Replaces golangci-lint's `modernize` linter -- do not enable both.
      # Requires Go 1.26: `go fix` gained -diff there. Skip on older toolchains.
      - name: Check code is modernized
        if: >-
          ${{ !cancelled() && steps.deps.outcome != 'failure'
          && !contains(format(' {0} ', inputs.skip), ' modernize ') }}
        run: go fix -diff ./...

  test:
    name: test
    if: ${{ !contains(format(' {0} ', inputs.skip), ' test ') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: validate
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
        go: ${{ fromJSON(inputs.go-versions) }}
    env:
      GOPRIVATE: ${{ inputs.goprivate }}
    # This is the only job that runs on non-Linux runners. Without this, a
    # multiline `run:` uses pwsh on Windows, where only the LAST command's exit
    # code fails the step -- an earlier failure is silently swallowed.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        # clover: provider=auto constraint=minor tags=checkout,github
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      # Tokens via env, never interpolated into the script body.
      - name: Configure private module access
        if: ${{ inputs.goprivate != '' }}
        run: |
          # Dependabot-triggered runs resolve secrets from the Dependabot
          # store; an unset MODULE_TOKEN silently falls back to github.token,
          # which only reaches this repo. Warn rather than fail: the fallback
          # is legitimate when goprivate covers nothing outside this repo.
          if [ "${GITHUB_ACTOR}" = "dependabot[bot]" ] && [ -z "${MODULE_TOKEN}" ]; then
            echo "::warning::MODULE_TOKEN is empty on a Dependabot run -- if the module fetch fails below, add MODULE_TOKEN to the repository's Dependabot secrets."
          fi
          token="${MODULE_TOKEN:-${DEFAULT_TOKEN}}"
          git config --global \
            url."https://x-access-token:${token}@github.com/".insteadOf "https://github.com/"
        shell: bash
        env:
          DEFAULT_TOKEN: ${{ github.token }}
          MODULE_TOKEN: ${{ secrets.MODULE_TOKEN }}

      - name: Set up Go
        # clover: provider=auto constraint=minor tags=setup-go,github
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go-version wins when set; an empty matrix entry falls back to the file.
          go-version: ${{ matrix.go }}
          go-version-file: ${{ inputs.go-version-file }}
          cache: true

      - name: Download and verify deps
        if: ${{ !contains(format(' {0} ', inputs.skip), ' deps ') }}
        run: |
          go mod download
          go mod verify

      - name: Build
        run: go build ./...

      - name: Test
        run: |
          read -ra args <<< "${TEST_ARGS}"
          go test "${args[@]}"
        env:
          TEST_ARGS: ${{ inputs.test-args }}

  cross-compile:
    name: cross-compile
    if: >-
      ${{ inputs.cross-compile-targets != '[]'
      && !contains(format(' {0} ', inputs.skip), ' cross-compile ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate
    permissions:
      contents: read
    env:
      GOPRIVATE: ${{ inputs.goprivate }}
    steps:
      - name: Checkout
        # clover: provider=auto constraint=minor tags=checkout,github
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      # Tokens via env, never interpolated into the script body.
      - name: Configure private module access
        if: ${{ inputs.goprivate != '' }}
        run: |
          # Dependabot-triggered runs resolve secrets from the Dependabot
          # store; an unset MODULE_TOKEN silently falls back to github.token,
          # which only reaches this repo. Warn rather than fail: the fallback
          # is legitimate when goprivate covers nothing outside this repo.
          if [ "${GITHUB_ACTOR}" = "dependabot[bot]" ] && [ -z "${MODULE_TOKEN}" ]; then
            echo "::warning::MODULE_TOKEN is empty on a Dependabot run -- if the module fetch fails below, add MODULE_TOKEN to the repository's Dependabot secrets."
          fi
          token="${MODULE_TOKEN:-${DEFAULT_TOKEN}}"
          git config --global \
            url."https://x-access-token:${token}@github.com/".insteadOf "https://github.com/"
        shell: bash
        env:
          DEFAULT_TOKEN: ${{ github.token }}
          MODULE_TOKEN: ${{ secrets.MODULE_TOKEN }}

      - name: Set up Go
        # clover: provider=auto constraint=minor tags=setup-go,github
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true

      # `go vet` too: `go build` does not typecheck _test.go for the target.
      - name: Build and vet each target
        run: |
          failed=""
          while IFS= read -r target; do
            [ -n "${target}" ] || continue
            GOOS="${target%%/*}"
            GOARCH="${target##*/}"
            export GOOS GOARCH
            echo "::group::${GOOS}/${GOARCH}"
            if go build ./... && go vet ./...; then
              echo "ok"
            else
              echo "::error::cross-compile failed for ${GOOS}/${GOARCH}"
              failed="${failed} ${GOOS}/${GOARCH}"
            fi
            echo "::endgroup::"
          done <<<"$(printf '%s' "${TARGETS}" | jq -r '.[]')"
          if [ -n "${failed}" ]; then
            echo "::error::failing targets:${failed}"
            exit 1
          fi
        shell: bash
        env:
          CGO_ENABLED: "0"
          TARGETS: ${{ inputs.cross-compile-targets }}

  race:
    name: race
    if: ${{ !contains(format(' {0} ', inputs.skip), ' race ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate
    permissions:
      contents: read
    env:
      CGO_ENABLED: "1"
      GOPRIVATE: ${{ inputs.goprivate }}
    steps:
      - name: Checkout
        # clover: provider=auto constraint=minor tags=checkout,github
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      # Tokens via env, never interpolated into the script body.
      - name: Configure private module access
        if: ${{ inputs.goprivate != '' }}
        run: |
          # Dependabot-triggered runs resolve secrets from the Dependabot
          # store; an unset MODULE_TOKEN silently falls back to github.token,
          # which only reaches this repo. Warn rather than fail: the fallback
          # is legitimate when goprivate covers nothing outside this repo.
          if [ "${GITHUB_ACTOR}" = "dependabot[bot]" ] && [ -z "${MODULE_TOKEN}" ]; then
            echo "::warning::MODULE_TOKEN is empty on a Dependabot run -- if the module fetch fails below, add MODULE_TOKEN to the repository's Dependabot secrets."
          fi
          token="${MODULE_TOKEN:-${DEFAULT_TOKEN}}"
          git config --global \
            url."https://x-access-token:${token}@github.com/".insteadOf "https://github.com/"
        shell: bash
        env:
          DEFAULT_TOKEN: ${{ github.token }}
          MODULE_TOKEN: ${{ secrets.MODULE_TOKEN }}

      - name: Set up Go
        # clover: provider=auto constraint=minor tags=setup-go,github
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true

      - name: Download and verify deps
        if: ${{ !contains(format(' {0} ', inputs.skip), ' deps ') }}
        run: |
          go mod download
          go mod verify

      # -p 2 lives in the default race-args: -p and -parallel both default to
      # GOMAXPROCS, and -race costs 5-10x memory per binary. Private-repo
      # runners (2 vCPU/8 GB) already default to -p 2; on public runners
      # (4 vCPU/16 GB) it trades wall time for headroom -- override race-args
      # to drop it.
      # -count=1 is redundant next to -shuffle (which already disables result
      # caching), but stays so overrides built by editing this string and
      # dropping -shuffle keep the guard against golang/go#74873 (stale merged
      # coverage on cached -coverpkg runs, fixed in Go 1.27).
      - name: Test with race detector and coverage
        run: |
          read -ra args <<< "${RACE_ARGS}"
          go test "${args[@]}" -coverprofile=coverage.out -covermode=atomic
        shell: bash
        env:
          RACE_ARGS: ${{ inputs.race-args }}

      - name: Report coverage
        id: coverage
        run: |
          go tool cover -html=coverage.out -o coverage.html
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')"
          echo "total=${total}" >>"${GITHUB_OUTPUT}"
          {
            printf '### Coverage: %s\n\n' "${total}"
            printf '```\n'
            go tool cover -func=coverage.out | tail -n 20
            printf '```\n'
          } >>"${GITHUB_STEP_SUMMARY}"
        shell: bash

      - name: Enforce coverage threshold
        if: ${{ inputs.coverage-threshold > 0 }}
        run: |
          actual="${TOTAL%\%}"
          if awk -v a="${actual}" -v t="${THRESHOLD}" 'BEGIN { exit !(a < t) }'; then
            echo "::error::Coverage ${actual}% is below threshold ${THRESHOLD}%"
            exit 1
          fi
          echo "Coverage ${actual}% meets threshold ${THRESHOLD}%"
        shell: bash
        env:
          TOTAL: ${{ steps.coverage.outputs.total }}
          THRESHOLD: ${{ inputs.coverage-threshold }}

      - name: Upload coverage
        if: ${{ !cancelled() }}
        # clover: provider=auto constraint=minor tags=upload-artifact,github
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            coverage.out
            coverage.html
          retention-days: 7

  # The single check branch protection should require: matrix legs produce
  # per-cell names that change with the caller's inputs, and skipped jobs never
  # report. `always()` because success()/failure() skip when a need skips.
  required:
    name: go-ci
    if: ${{ always() }}
    needs: [validate, lint, test, cross-compile, race]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Check job results
        run: |
          failed="$(printf '%s' "${NEEDS}" \
            | jq -r 'with_entries(select(.value.result == "failure"
                     or .value.result == "cancelled")) | keys[]')"
          if [ -n "${failed}" ]; then
            echo "::error::failing jobs: $(echo "${failed}" | tr '\n' ' ')"
            exit 1
          fi
          echo "All required jobs passed or were skipped."
        shell: bash
        env:
          NEEDS: ${{ toJson(needs) }}
