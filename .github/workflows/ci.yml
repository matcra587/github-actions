---
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: TypeScript checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # clover: provider=auto constraint=minor tags=checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install mise
        # clover: provider=auto constraint=minor tags=mise-action
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.4.28
          github_token: ${{ github.token }}

      - name: Install dependencies
        run: bun ci

      - name: Run checks
        run: bun run all

      - name: Ensure bundled actions are committed
        # Presence first: `git diff` on a never-committed bundle is
        # vacuously clean, which is how a missing dist shipped once.
        run: |
          for bundle in packages/*/dist/index.js; do
            git ls-files --error-unmatch "${bundle}"
          done
          git diff --exit-code -- 'packages/*/dist/index.js'
