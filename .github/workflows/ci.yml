---
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: TypeScript checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # @clover: constraint=major tags=checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install mise
        # @clover: constraint=major tags=mise-action
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          # clover: provider=github repository=jdx/mise constraint=major tags=mise
          version: 2026.9.4
          github_token: ${{ github.token }}

      - name: Install dependencies
        run: bun ci

      - name: Run checks
        run: bun run all

      - name: Check action runtime compatibility
        # Match the node24 runtime declared by the JavaScript actions.
        # clover: provider=node find=node@<version> constraint=minor tags=action-runtime
        run: mise exec node@24.21.0 -- node --test tests/node-runtime.test.mjs

      - name: Ensure bundled actions are committed
        # Presence first: `git diff` on a never-committed bundle is
        # vacuously clean, which is how a missing dist shipped once.
        run: |
          for bundle in packages/*/dist/index.js; do
            git ls-files --error-unmatch "${bundle}"
          done
          git diff --exit-code -- 'packages/*/dist/index.js'
