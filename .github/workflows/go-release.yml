---
# Reusable release workflow for Go packages published as tag + GitHub
# release, with the release body composed from changie notes: the version's
# curated changelog (emoji-decorated headings), the commits since the
# previous tag, and a compare link. The committed CHANGELOG.md stays plain —
# decoration exists only in the release body.
#
# Caller contract:
#   - `.changes/<tag>.md` exists in the tagged tree (changie batch + merge
#     are committed before tagging).
#   - `.goreleaser.yaml` must NOT set `changelog.disable: true` — GoReleaser
#     silently ignores --release-notes when the changelog step is disabled
#     and publishes an empty body.
#   - The tagged commit must have been the tip of a pushed branch, so the
#     gates listed in `gates` ran for its exact SHA.
#
# Contract violations fail preflight with named errors. Outputs (`version`,
# `release-url`) let callers chain follow-up jobs.
name: go-release

on:
  workflow_call:
    inputs:
      gates:
        description: >-
          Whitespace-separated workflow files (e.g. "test.yml lint.yml") that
          must have a green push run for the tagged commit before publishing.
          Empty skips the wait.
        type: string
        default: ""
      go-version-file:
        description: File the Go toolchain version is read from.
        type: string
        default: go.mod
      goreleaser-version:
        description: GoReleaser version to release with.
        type: string
        default: v2.17.0
      environment:
        description: Deployment environment for the release job.
        type: string
        default: deploy
      warm-proxy:
        description: >-
          Request the released version from proxy.golang.org after publishing
          so `go get` and pkg.go.dev see it within a minute instead of waiting
          for organic discovery. Public modules only.
        type: boolean
        default: true
    outputs:
      version:
        description: The released tag (e.g. v1.2.3).
        value: ${{ jobs.release.outputs.version }}
      release-url:
        description: URL of the published GitHub release.
        value: ${{ jobs.release.outputs.release-url }}

permissions: {}

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: write # Required to create GitHub releases.
      actions: read # Required to read the gate runs for the tagged commit.
    outputs:
      version: ${{ github.ref_name }}
      release-url: ${{ steps.published.outputs.url }}
    steps:
      - name: Validate release tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: '[[ "${TAG_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
        shell: bash

      - name: Checkout
        # clover: provider=auto constraint=minor tags=checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The previous-tag lookup and commit list need full history + tags.
          fetch-depth: 0
          persist-credentials: false

      - name: Check release state
        id: release-state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "exists=true" >>"${GITHUB_OUTPUT}"
            echo "release ${TAG_NAME} already exists; skipping publish"
          else
            echo "exists=false" >>"${GITHUB_OUTPUT}"
          fi
        shell: bash

      # Validation belongs to the caller's own workflows, which run on every
      # push. This job only waits for the listed gates covering the exact
      # tagged commit to go green — it never builds or validates from cached
      # state itself.
      - name: Await gates for tagged commit
        if: steps.release-state.outputs.exists != 'true' && inputs.gates != ''
        # clover: provider=github repository=matcra587/github-actions tag-prefix=await-gates/ tags=actions
        uses: matcra587/github-actions/packages/await-gates@0d4d0ac90375afc54cae61ea6023cdb1da4aa5a3 # tag=await-gates/v0.1.0
        with:
          gates: ${{ inputs.gates }}

      - name: Preflight caller contract
        if: steps.release-state.outputs.exists != 'true'
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! -f ".changes/${TAG_NAME}.md" ]]; then
            echo "::error::.changes/${TAG_NAME}.md not found — commit the changie batch before tagging"
            exit 1
          fi
          for cfg in .goreleaser.yaml .goreleaser.yml; do
            [[ -f "${cfg}" ]] || continue
            # A disabled changelog step makes GoReleaser silently ignore
            # --release-notes and publish an empty body.
            if awk '/^changelog:/{block=1; next} /^[^ #]/{block=0} block && /disable:[[:space:]]*true/{found=1} END{exit !found}' "${cfg}"; then
              echo "::error file=${cfg}::changelog.disable: true makes GoReleaser ignore --release-notes and publish an empty release body — remove it"
              exit 1
            fi
          done
        shell: bash

      - name: Set up Go
        if: steps.release-state.outputs.exists != 'true'
        # clover: provider=auto constraint=minor tags=setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
          # Release jobs must not consume shared caches: a poisoned cache
          # entry would flow into published artifacts (zizmor cache-poisoning).
          cache: false

      - name: Compose release body
        if: steps.release-state.outputs.exists != 'true'
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes=".changes/${TAG_NAME}.md"
          repo="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          {
            # Drop the "## [x.y.z](...) — date" heading: the release page
            # already carries the version, tag, and date. Kind headings are
            # decorated here so CHANGELOG.md stays plain markdown.
            tail -n +3 "${notes}" | sed -E \
              -e 's/^### Added$/### ✨ Added/' \
              -e 's/^### Changed$/### 🔥 Changed/' \
              -e 's/^### Fixed$/### 🪲 Fixed/' \
              -e 's/^### Breaking Changes$/### ⚠️ Breaking Changes/' \
              -e 's/^### Removed$/### 🗑️ Removed/' \
              -e 's/^### Deprecated$/### ⚰️ Deprecated/' \
              -e 's/^### Security$/### 🦺 Security/' \
              -e 's/^### Dependencies$/### 📦 Dependencies/'
            # A first release has no baseline: its commit list would be the
            # entire history, so the trailing sections are dropped.
            prev="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${TAG_NAME}^" 2>/dev/null || true)"
            if [[ -n "${prev}" ]]; then
              echo
              echo "### 📜 Commits"
              echo
              git log --reverse --invert-grep --grep='^chore(release)' \
                --pretty="* [\`%h\`](${repo}/commit/%H) %s" "${prev}..${TAG_NAME}"
              echo
              echo "**Full Changelog**: ${repo}/compare/${prev}...${TAG_NAME}"
            fi
          } > "${RUNNER_TEMP}/release-notes.md"
          cat "${RUNNER_TEMP}/release-notes.md"
        shell: bash

      - name: Run GoReleaser
        if: steps.release-state.outputs.exists != 'true'
        # clover: provider=auto constraint=minor tags=goreleaser-action
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: ${{ inputs.goreleaser-version }}
          # runner.temp keeps the notes out of the checkout: goreleaser
          # --clean refuses to release from a dirty worktree, and the
          # action execs goreleaser without a shell, so an env var here
          # would never expand.
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # No exists-guard: callers get the URL output on re-runs too.
      - name: Resolve release URL
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          url="$(gh release view "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" --json url --jq .url)"
          echo "url=${url}" >>"${GITHUB_OUTPUT}"
        shell: bash

      # Makes the version visible to `go get` and pkg.go.dev within a
      # minute instead of waiting for organic discovery. Runs from a
      # scratch module (a module cannot query its own version); private
      # repos skip automatically — the public proxy cannot fetch them.
      - name: Warm the Go module proxy
        if: >-
          steps.release-state.outputs.exists != 'true' &&
          inputs.warm-proxy &&
          github.event.repository.private == false
        env:
          TAG_NAME: ${{ github.ref_name }}
          GOPROXY: https://proxy.golang.org
        run: |
          set -euo pipefail
          module="$(awk '/^module /{print $2; exit}' go.mod)"
          cd "$(mktemp -d)"
          go mod init proxywarm >/dev/null 2>&1
          go list -m "${module}@${TAG_NAME}"
        shell: bash
