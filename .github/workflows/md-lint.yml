---
name: md-lint

on:
  workflow_call:
    inputs:
      report-type:
        description: rumdl report type (annotations, github, summary).
        type: string
        default: annotations

permissions: {}

jobs:
  rumdl:
    name: rumdl
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        # @clover: constraint=major tags=checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run rumdl
        # @clover: constraint=major tags=rumdl
        uses: rvben/rumdl@19006897519812a2fdc508314b34738e5c281233 # v0.3.0
        with:
          report-type: ${{ inputs.report-type }}
