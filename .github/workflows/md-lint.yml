---
name: md-lint

on:
  workflow_call:
    inputs:
      report-type:
        description: rumdl report type (annotations, github, summary).
        type: string
        default: annotations

permissions: {}

jobs:
  rumdl:
    name: rumdl
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run rumdl
        uses: rvben/rumdl@a2da0e5a1321281402d4c65f5b735696a7f5f73f # v0.2.16
        with:
          report-type: ${{ inputs.report-type }}
