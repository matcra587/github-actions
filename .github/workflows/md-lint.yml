---
name: md-lint

on:
  workflow_call:
    inputs:
      report-type:
        description: rumdl report type (annotations, github, summary).
        type: string
        default: annotations

permissions: {}

jobs:
  rumdl:
    name: rumdl
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        # clover: provider=auto constraint=minor tags=checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run rumdl
        # clover: provider=auto constraint=minor tags=rumdl
        uses: rvben/rumdl@4997ff07b63c7a54d6a495ebcd3ce7f23ee1173f # v0.2.55
        with:
          report-type: ${{ inputs.report-type }}
