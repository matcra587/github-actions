---
name: md-lint

on:
  workflow_call:
    inputs:
      report-type:
        description: rumdl report type (annotations, github, summary).
        type: string
        default: annotations

permissions: {}

jobs:
  rumdl:
    name: rumdl
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        # clover: provider=auto constraint=minor tags=checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run rumdl
        # clover: provider=auto constraint=minor tags=rumdl
        uses: rvben/rumdl@9faf4696d56c0cff426a2f85b3fd476ebe0d0ec0 # v0.2.52
        with:
          report-type: ${{ inputs.report-type }}
