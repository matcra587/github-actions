---
name: release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Which package to release.
        required: true
        type: choice
        options:
          - await-gates
          - homebrew-publish-formula
          - security
          - validate-skills
      draft:
        description: Create the GitHub release as a draft.
        required: false
        type: boolean
        default: false
      prerelease:
        description: Mark the GitHub release as a prerelease.
        required: false
        type: boolean
        default: false
      notes:
        description: Optional release notes.
        required: false
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Release actions
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: deploy
    permissions:
      contents: read # App token (minted below) handles the privileged tag/release create.
    steps:
      - name: Checkout
        # clover: provider=auto constraint=minor tags=checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install mise
        # clover: provider=auto constraint=minor tags=mise-action
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          version: 2026.4.28
          github_token: ${{ github.token }}

      - name: Install dependencies
        run: bun ci

      - name: Run checks
        run: bun run all

      - name: Ensure bundled actions are committed
        # Presence first: `git diff` on a never-committed bundle is
        # vacuously clean, which is how a missing dist shipped once.
        # Checks every bundle, not just the released one -- scoping it to
        # one package made it a silent no-op for any name with no dist.
        run: |
          for bundle in packages/*/dist/index.js; do
            git ls-files --error-unmatch "${bundle}"
          done
          git diff --exit-code -- 'packages/*/dist/index.js'

      - name: Read version from package.json
        id: version
        # clover: provider=auto constraint=minor tags=github-script
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PACKAGE: ${{ inputs.package }}
        with:
          result-encoding: string
          script: |
            const fs = require('fs');
            const path = require('path');
            const packageDir = process.env.PACKAGE;
            // Tag prefix mapping: short alias for homebrew-publish-formula
            // (backward-compat with existing tags), package dir name otherwise.
            const tagPrefix = packageDir === 'homebrew-publish-formula'
              ? 'homebrew'
              : packageDir;
            const pkg = JSON.parse(
              fs.readFileSync(
                path.join(
                  process.env.GITHUB_WORKSPACE,
                  `packages/${packageDir}/package.json`,
                ),
                'utf8',
              ),
            );
            const version = pkg.version;
            if (!/^\d+\.\d+\.\d+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$/.test(version)) {
              core.setFailed(`package.json version must be SemVer (got: ${version})`);
              return;
            }
            return `${tagPrefix}/v${version}`;

      - name: Generate App token
        id: app-token
        # clover: provider=auto constraint=minor tags=create-github-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Create release
        run: |
          set -euo pipefail

          git fetch --tags --force
          if git rev-parse --quiet --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "tag ${VERSION} already exists" >&2
            exit 1
          fi
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "release ${VERSION} already exists" >&2
            exit 1
          fi

          {
            if [ -n "${RELEASE_NOTES}" ]; then
              printf "%s\n\n" "${RELEASE_NOTES}"
            else
              printf "Release %s.\n\n" "${VERSION}"
            fi
            printf "Reviewed commit: %s\n\n" "${GITHUB_SHA}"
            printf "Consumers should pin actions and reusable workflows to this commit SHA.\n"
          } > release-notes.md

          args=(
            release create "${VERSION}"
            --target "${GITHUB_SHA}"
            --title "${VERSION}"
            --notes-file release-notes.md
          )

          if [ "${DRAFT}" = "true" ]; then
            args+=(--draft)
          fi
          if [ "${PRERELEASE}" = "true" ]; then
            args+=(--prerelease)
          fi

          gh "${args[@]}"
        shell: bash
        env:
          DRAFT: ${{ inputs.draft }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_NOTES: ${{ inputs.notes }}
          VERSION: ${{ steps.version.outputs.result }}
