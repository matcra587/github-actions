---
name: go-lint

on:
  workflow_call:
    inputs:
      go-version:
        description: Go toolchain version.
        type: string
        default: "1.26"
      timeout:
        description: golangci-lint timeout (e.g. 5m).
        type: string
        default: "5m"

permissions: {}

jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Download deps
        run: go mod download

      - name: Run golangci-lint
        run: go tool golangci-lint run --timeout="${TIMEOUT}"
        shell: bash
        env:
          TIMEOUT: ${{ inputs.timeout }}
