---
name: security

on:
  workflow_call:
    inputs:
      skip:
        description: >-
          Jobs to skip, whitespace-separated. Entries are verified — unknown
          names fail the workflow. Allowed values are actionlint, zizmor,
          govulncheck, bun-audit, uv-audit, codeql, and dependency-review.
          Everything runs by default; jobs also gate themselves at runtime
          (linguist languages, lockfile presence, PR event, repo visibility).
        type: string
        default: ""
      actionlint-version:
        description: actionlint version installed by mise.
        type: string
        default: "1.7.12"
      mise-version:
        description: mise version used to install actionlint. Empty installs the latest release, which also satisfies any min_version in the caller repo's mise.toml.
        type: string
        default: ""
      actionlint-args:
        description: Newline-separated arguments passed to actionlint.
        type: string
        default: |-
          -color
      zizmor-inputs:
        description: Paths passed to zizmor.
        type: string
        default: ./.github/
      zizmor-version:
        description: zizmor version installed by zizmor-action.
        type: string
        # 1.24.1 misparses monorepo-prefixed tag comments (homebrew/v0.1.0)
        # as a missing version; fixed by 1.27.0.
        default: "1.28.0"
      zizmor-online-audits:
        description: Run zizmor online audits.
        type: boolean
        default: true
      zizmor-persona:
        description: Zizmor persona.
        type: string
        default: pedantic
      zizmor-min-severity:
        description: Minimum zizmor severity to report.
        type: string
        default: ""
      zizmor-min-confidence:
        description: Minimum zizmor confidence to report.
        type: string
        default: ""
      sarif:
        description: Upload SARIF results (zizmor, govulncheck, uv audit) to GitHub code scanning. Suppressed automatically on private repositories, where GHAS is a paid feature. Callers enabling this must grant security-events write.
        type: boolean
        default: false
      zizmor-annotations:
        description: Emit workflow annotations.
        type: boolean
        default: true
      zizmor-color:
        description: Emit colorized zizmor CLI output.
        type: boolean
        default: true
      zizmor-config:
        description: Optional zizmor configuration path.
        type: string
        default: ""
      zizmor-fail-on-no-inputs:
        description: Fail if zizmor cannot collect any inputs.
        type: boolean
        default: true
      go-version-file:
        description: Path to the go.mod govulncheck uses for toolchain selection.
        type: string
        default: go.mod
      go-package:
        description: Package pattern passed to govulncheck.
        type: string
        default: ./...
      dependency-review-fail-on-severity:
        description: Severity threshold passed to dependency-review.
        type: string
        default: moderate
      bun-version:
        description: Bun version installed by setup-bun.
        type: string
        default: latest
      bun-audit-level:
        description: Minimum advisory severity passed to `bun audit --audit-level`.
        type: string
        default: moderate
      uv-version:
        description: uv version installed by setup-uv.
        type: string
        default: latest

jobs:
  actionlint:
    name: ActionLint
    if: "!contains(inputs.skip, 'actionlint')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        # clover: provider=auto constraint=minor tags=checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install mise
        # clover: provider=auto constraint=minor tags=mise-action
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          version: ${{ inputs.mise-version }}
          github_token: ${{ github.token }}
          mise_toml: |
            [tools]
            actionlint = "${{ inputs.actionlint-version }}"

      - name: Run actionlint
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r arg; do
            if [ -n "${arg}" ]; then
              args+=("${arg}")
            fi
          done <<< "${ACTIONLINT_ARGS}"
          actionlint "${args[@]}"
        shell: bash
        env:
          ACTIONLINT_ARGS: ${{ inputs.actionlint-args }}

  zizmor:
    name: Zizmor workflow security
    needs: context
    if: "!contains(inputs.skip, 'zizmor')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # clover: provider=auto constraint=minor tags=checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run zizmor
        # clover: provider=auto constraint=minor tags=zizmor-action
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          inputs: ${{ inputs.zizmor-inputs }}
          online-audits: ${{ inputs.zizmor-online-audits }}
          persona: ${{ inputs.zizmor-persona }}
          min-severity: ${{ inputs.zizmor-min-severity }}
          min-confidence: ${{ inputs.zizmor-min-confidence }}
          version: ${{ inputs.zizmor-version }}
          token: ${{ github.token }}
          # annotations and advanced-security are mutually exclusive in the
          # action (it hard-fails on both), so annotations yields whenever
          # the SARIF path is effective.
          advanced-security: ${{ needs.context.outputs.sarif-effective }}
          annotations: ${{ inputs.zizmor-annotations && needs.context.outputs.sarif-effective != 'true' }}
          color: ${{ inputs.zizmor-color }}
          config: ${{ inputs.zizmor-config }}
          fail-on-no-inputs: ${{ inputs.zizmor-fail-on-no-inputs }}

  # Resolves the repository facts the other jobs gate on: the full linguist
  # language set (so language scanners self-gate at the job level, and new
  # scanners consume it read-only):
  #   contains(fromJSON(needs.context.outputs.languages), 'Python')
  # and the repo visibility. Always runs: one cheap API call (two on
  # scheduled runs), and it fails fast on skip-list typos — a silently
  # ignored typo would leave the caller believing a scan is off while it
  # still runs (or vice versa).
  context:
    name: Repository context
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      languages: ${{ steps.linguist.outputs.languages }}
      codeql-matrix: ${{ steps.linguist.outputs.codeql-matrix }}
      # "SARIF upload is effective": requested by the caller and the repo is
      # public (GHAS code scanning is paid on private repos). Visibility is
      # resolved server-side because the schedule event has no repository
      # payload — `!github.event.repository.private` reads true (public)
      # on scheduled runs, silently lifting the private-repo suppression.
      sarif-effective: ${{ inputs.sarif && steps.linguist.outputs.private != 'true' }}
    steps:
      - name: Validate skip list and query linguist
        id: linguist
        # clover: provider=auto constraint=minor tags=github-script
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SKIP: ${{ inputs.skip }}
        with:
          script: |
            const allowed = ['actionlint', 'zizmor', 'govulncheck', 'bun-audit', 'uv-audit', 'codeql', 'dependency-review'];
            const unknown = process.env.SKIP.split(/\s+/).filter(Boolean)
              .filter((name) => !allowed.includes(name));
            if (unknown.length > 0) {
              core.setFailed(`Unknown skip entries: ${unknown.join(', ')}. Allowed: ${allowed.join(', ')}.`);
              return;
            }
            const { data: languages } = await github.rest.repos.listLanguages({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const names = Object.keys(languages);
            core.info(`Linguist languages: ${names.join(', ') || '(none)'}`);
            core.setOutput('languages', JSON.stringify(names));
            // Interpreted languages analyze with build-mode none; Go needs
            // autobuild (none is unsupported for Go/Swift/Kotlin). Other
            // compiled languages are out — they'd need manual build steps.
            const codeqlMap = {
              Go: { language: 'go', 'build-mode': 'autobuild' },
              JavaScript: { language: 'javascript-typescript', 'build-mode': 'none' },
              TypeScript: { language: 'javascript-typescript', 'build-mode': 'none' },
              Python: { language: 'python', 'build-mode': 'none' },
              Ruby: { language: 'ruby', 'build-mode': 'none' },
            };
            const seen = new Set();
            const codeqlMatrix = [];
            for (const name of names) {
              const entry = codeqlMap[name];
              if (entry && !seen.has(entry.language)) {
                seen.add(entry.language);
                codeqlMatrix.push(entry);
              }
            }
            core.setOutput('codeql-matrix', JSON.stringify(codeqlMatrix));
            const repository = context.payload.repository
              ?? (await github.rest.repos.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
              })).data;
            core.info(`Repository private: ${repository.private}`);
            core.setOutput('private', repository.private);

  # No explicit permissions: inherits the caller's so the SARIF upload can
  # receive security-events write when the caller grants it.
  govulncheck:
    name: govulncheck
    needs: context
    if: "!contains(inputs.skip, 'govulncheck') && contains(fromJSON(needs.context.outputs.languages), 'Go')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # clover: provider=auto constraint=minor tags=checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      # The action handles its own Go setup; repo-checkout is off because
      # the explicit checkout above already ran with hardened settings.
      # Guarded on go.mod: linguist reports Go for any .go file, but
      # govulncheck needs a module at the configured path.
      - name: Run govulncheck
        if: hashFiles(inputs.go-version-file) != ''
        # clover: provider=auto constraint=minor tags=govulncheck-action
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          repo-checkout: false
          go-version-file: ${{ inputs.go-version-file }}
          go-package: ${{ inputs.go-package }}

      # Second pass only for code scanning: govulncheck's SARIF mode exits 0
      # on findings, so the text pass above still owns failing the job.
      - name: Run govulncheck (SARIF)
        if: ${{ !cancelled() && hashFiles(inputs.go-version-file) != '' && needs.context.outputs.sarif-effective == 'true' }}
        # clover: provider=auto constraint=minor tags=govulncheck-action
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          repo-checkout: false
          go-version-file: ${{ inputs.go-version-file }}
          go-package: ${{ inputs.go-package }}
          output-format: sarif
          output-file: govulncheck.sarif

      - name: Upload SARIF to code scanning
        if: ${{ !cancelled() && hashFiles(inputs.go-version-file) != '' && needs.context.outputs.sarif-effective == 'true' }}
        # clover: provider=auto constraint=minor tags=codeql-action
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck

  bun-audit:
    name: Bun audit
    needs: context
    if: >-
      !contains(inputs.skip, 'bun-audit') && (
        contains(fromJSON(needs.context.outputs.languages), 'JavaScript') ||
        contains(fromJSON(needs.context.outputs.languages), 'TypeScript')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        # clover: provider=auto constraint=minor tags=checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      # bun audit reads the lockfile directly, no install needed. Repos that
      # are JavaScript/TypeScript per linguist but not Bun-managed skip here.
      - name: Install Bun
        if: hashFiles('bun.lock', 'bun.lockb') != ''
        # clover: provider=auto constraint=minor tags=setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Run bun audit
        if: hashFiles('bun.lock', 'bun.lockb') != ''
        run: bun audit --audit-level="${BUN_AUDIT_LEVEL}"
        shell: bash
        env:
          BUN_AUDIT_LEVEL: ${{ inputs.bun-audit-level }}

  # No explicit permissions: inherits the caller's so the SARIF upload can
  # receive security-events write when the caller grants it.
  uv-audit:
    name: uv audit
    needs: context
    if: >-
      !contains(inputs.skip, 'uv-audit') &&
      contains(fromJSON(needs.context.outputs.languages), 'Python')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # clover: provider=auto constraint=minor tags=checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      # uv audit reads uv.lock directly. Repos that are Python per linguist
      # but not uv-managed skip here.
      - name: Install uv
        if: hashFiles('uv.lock') != ''
        # clover: provider=auto constraint=minor tags=setup-uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ inputs.uv-version }}

      # Exactly one of the next two steps runs. Unlike govulncheck, uv audit
      # still exits nonzero on findings in SARIF mode, so a single pass both
      # fails the job and produces the upload artifact; findings then live in
      # code scanning rather than the job log.
      - name: Run uv audit
        if: ${{ hashFiles('uv.lock') != '' && needs.context.outputs.sarif-effective != 'true' }}
        run: uv audit --frozen

      - name: Run uv audit (SARIF)
        if: ${{ hashFiles('uv.lock') != '' && needs.context.outputs.sarif-effective == 'true' }}
        run: uv audit --frozen --output-format sarif > uv-audit.sarif

      - name: Upload SARIF to code scanning
        if: ${{ !cancelled() && hashFiles('uv.lock') != '' && needs.context.outputs.sarif-effective == 'true' }}
        # clover: provider=auto constraint=minor tags=codeql-action
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: uv-audit.sarif
          category: uv-audit

  # CodeQL only produces value through its code-scanning upload, which needs
  # GHAS and caller-granted security-events write — so the whole job keys off
  # the same sarif-effective fact as the other uploads. No explicit
  # permissions block for the same passthrough reason as the scanners above.
  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: context
    if: >-
      !contains(inputs.skip, 'codeql') &&
      needs.context.outputs.sarif-effective == 'true' &&
      needs.context.outputs.codeql-matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.context.outputs.codeql-matrix) }}
    steps:
      - name: Checkout
        # clover: provider=auto constraint=minor tags=checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize CodeQL
        # clover: provider=auto constraint=minor tags=codeql-action
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Analyze
        # clover: provider=auto constraint=minor tags=codeql-action
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          category: codeql:${{ matrix.language }}

  # PR-only: the action diffs the PR's dependency changes against the
  # GitHub Advisory Database; there is no diff to review on a push. Gated to
  # public visibility because the dependency-diff API needs GitHub Advanced
  # Security on private repos. The event-based visibility read is safe here
  # (unlike the context job's concern): PR payloads always carry
  # repository.private, so no needs edge on context.
  dependency-review:
    name: Dependency review
    if: "!contains(inputs.skip, 'dependency-review') && github.event_name == 'pull_request' && !github.event.repository.private"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        # clover: provider=auto constraint=minor tags=checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Dependency review
        # clover: provider=auto constraint=minor tags=dependency-review-action
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: ${{ inputs.dependency-review-fail-on-severity }}
