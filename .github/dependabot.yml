---
version: 2

updates:
  # All packages/* manifests belong to the root Bun workspace and bun.lock.
  # Separate child-directory jobs omit that shared lockfile from update PRs.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: deps
      include: scope
    cooldown:
      default-days: 7
    groups:
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: deps
      include: scope
    cooldown:
      default-days: 7
