# yaml-language-server: $schema=https://raw.githubusercontent.com/gechr/clover/v0.4.3/internal/config/schema.json
required-version: ">=0.4.3"

paths:
  exclude:
    - "**/node_modules/**"
    - "**/dist/**"
    - "**/__fixtures__/**"
    - "**/__tests__/**"
    - "tests/**"
    - "**/bun.lock"
    - "**/mise.lock"
    - "**/.env*"
    - "**/secrets/**"
    - "**/credentials/**"
    - "**/.npmrc"
    - "**/.netrc"
    - "**/*.pem"
    - "**/*.key"

# Preview annotation changes unless explicitly requested.
annotate:
  write: false
