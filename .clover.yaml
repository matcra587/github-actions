# yaml-language-server: $schema=https://raw.githubusercontent.com/gechr/clover/main/internal/config/schema.json
required-version: ">=0.3.3"

paths:
  exclude:
    # Bundled action output — generated by `bun run build`, never hand-edited.
    - packages/**/dist/**
    # Out of scope for now: Clover tracks GitHub Actions pins only.
    # Remove this exclude to adopt the mise tool pins too.
    - .mise.toml
