[tools]
# @clover: constraint=major tags=actionlint
actionlint = "1.7.12"
# @clover: id=biome constraint=major tag-prefix=@biomejs/biome@ tags=biome
biome = "2.5.4"
# @clover: id=bun constraint=major tags=bun
bun = "1.3.14"
# @clover: id=hk constraint=major tags=hk
hk = "1.51.0"
# @clover: constraint=major tags=node
node = "26.5.0"
# @clover: constraint=major tags=pkl
pkl = "0.32.0"
# @clover: constraint=major tags=rumdl
rumdl = "0.2.34"
# @clover: constraint=major tags=shellcheck
shellcheck = "0.11.0"
# @clover: id=zizmor constraint=major tags=zizmor
zizmor = "1.28.0"

[env]
HK_MISE = 1
DO_NOT_TRACK = 1

[hooks]
postinstall = "hk install --mise"

[tasks.pre-commit]
run = "hk run pre-commit"
