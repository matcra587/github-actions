[tools]
# clover: provider=auto constraint=minor tags=actionlint
actionlint = "1.7.12"
# clover: provider=github id=biome repository=biomejs/biome constraint=minor tag-prefix=@biomejs/biome@ tags=biome
biome = "2.5.4"
# clover: provider=auto id=bun constraint=minor tags=bun
bun = "1.3.14"
# clover: provider=auto id=hk constraint=minor tags=hk
hk = "1.51.0"
# clover: provider=auto constraint=minor tags=node
node = "26.5.0"
# clover: provider=auto constraint=minor tags=pkl
pkl = "0.32.0"
# clover: provider=auto constraint=minor tags=rumdl
rumdl = "0.2.34"
# clover: provider=auto constraint=minor tags=shellcheck
shellcheck = "0.11.0"
# clover: provider=auto constraint=minor tags=zizmor
zizmor = "1.28.0"

[env]
HK_MISE = 1
DO_NOT_TRACK = 1

[hooks]
postinstall = "hk install --mise"

[tasks.pre-commit]
run = "hk run pre-commit"
