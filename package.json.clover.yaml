# Sidecar for package.json (strict JSON cannot host a directive).
# The packageManager field follows the bun pin in .mise.toml.
- from: bun
  jq: .packageManager
  tags: bun
# The @biomejs/biome dep follows the biome pin in .mise.toml so the CLI in
# node_modules matches the biome.jsonc schema version.
- from: biome
  jq: .devDependencies."@biomejs/biome"
  tags: biome
- provider: http
  url: https://registry.npmjs.org/@actions/artifact/latest
  extract: /"version"\s*:\s*"([^" ]+)"/
  find: '"@actions/artifact": "<version>"'
  constraint: major
  tags: npm
