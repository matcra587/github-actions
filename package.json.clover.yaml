# Sidecar for package.json (strict JSON cannot host a directive).
# The packageManager field follows the bun pin in .mise.toml.
- from: bun
  jq: .packageManager
  tags: bun
# The @biomejs/biome dep follows the biome pin in .mise.toml so the CLI in
# node_modules matches the biome.jsonc schema version.
- from: biome
  jq: .devDependencies."@biomejs/biome"
  tags: biome
- provider: npm
  package: '@actions/artifact'
  jq: .devDependencies."@actions/artifact"
  constraint: major
  tags: npm
- provider: npm
  package: '@actions/cache'
  jq: .devDependencies."@actions/cache"
  constraint: major
  tags: npm
- provider: npm
  package: '@actions/core'
  jq: .devDependencies."@actions/core"
  constraint: major
  tags: npm
- provider: npm
  package: '@actions/github'
  jq: .devDependencies."@actions/github"
  constraint: major
  tags: npm
- provider: npm
  package: '@github/local-action'
  jq: .devDependencies."@github/local-action"
  constraint: major
  tags: npm
- provider: npm
  package: tsx
  jq: .devDependencies."tsx"
  constraint: major
  tags: npm
- provider: npm
  package: brace-expansion
  jq: .overrides."brace-expansion"
  constraint: major
  tags: npm
- provider: npm
  package: undici
  jq: .overrides."undici"
  constraint: major
  tags: npm
